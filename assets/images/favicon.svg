<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bloopixGrad" x1="4" y1="4" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C8CFF"/>
